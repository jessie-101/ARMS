<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARMS | Administrator</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="dashboard-navbar">
    <div class="dashboard-logo">ARMS</div>
    <div class="student-info">
        <span id="adminGreetingName">Administrator</span>
        <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
</header>

<div class="dashboard-layout">

    <aside class="sidebar">
        <h3>Administrator Portal</h3>
        <nav>
            <a href="#studentsSection" class="active">Students</a>
            <a href="#supervisorsSection">Supervisors</a>
        </nav>
    </aside>

    <main class="dashboard-content">

        <div class="dashboard-header">
            <h1>Administrator Dashboard</h1>
            <p>Assign a supervisor to each student and manage accounts.</p>
        </div>

        <p id="adminMessage" class="form-error" style="display:none;"></p>

        <section class="dashboard-section" id="studentsSection">
            <h2>Students</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Student</th>
                            <th>Registration No.</th>
                            <th>Organization</th>
                            <th>Supervisor</th>
                            <th>Assign supervisor</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="adminStudentsBody">
                        <tr><td colspan="6">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="dashboard-section" id="supervisorsSection">
            <h2>Supervisors</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr><th>Name</th><th>Email</th><th>Department</th><th></th></tr>
                    </thead>
                    <tbody id="adminSupervisorsBody">
                        <tr><td colspan="4">Loading...</td></tr>
                    </tbody>
                </table>
            </div>

            <h3 style="margin-top:30px;">Add a supervisor</h3>
            <form id="addSupervisorForm">
                <div class="profile-grid">
                    <div class="form-group">
                        <label for="svFirstName">First Name</label>
                        <input type="text" id="svFirstName" required>
                    </div>
                    <div class="form-group">
                        <label for="svLastName">Last Name</label>
                        <input type="text" id="svLastName" required>
                    </div>
                    <div class="form-group">
                        <label for="svEmail">Email</label>
                        <input type="email" id="svEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="svPhone">Phone</label>
                        <input type="tel" id="svPhone">
                    </div>
                    <div class="form-group">
                        <label for="svDepartment">Department</label>
                        <input type="text" id="svDepartment">
                    </div>
                    <div class="form-group">
                        <label for="svPassword">Temporary Password</label>
                        <input type="password" id="svPassword" required>
                    </div>
                </div>
                <button type="submit" class="report-btn">Add supervisor</button>
            </form>
        </section>

    </main>

</div>

<script src="../js/main.js"></script>
</body>
</html>
