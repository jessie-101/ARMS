<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARMS | Forgot Password</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="navbar">
    <div class="logo">ARMS</div>
    <nav>
        <a href="../index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </nav>
</header>

<main class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Forgot Password</h1>
            <p>Enter your email and we will send you a link to reset your password.</p>
        </div>

        <p id="resetMessage" class="form-error" style="display:none;"></p>

        <form id="forgotForm">
            <div class="form-group">
                <label for="userType">Account Type</label>
                <select id="userType" name="userType">
                    <option value="student">Student</option>
                    <option value="supervisor">Supervisor</option>
                    <option value="admin">Administrator</option>
                </select>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <button type="submit" class="auth-btn" id="forgotBtn">Send Reset Link</button>
        </form>

        <p class="auth-footer"><a href="login.html">Back to login</a></p>
    </div>
</main>

<footer>
    <p>&copy; 2026 Attachment Record Management System</p>
</footer>

<script src="../js/main.js"></script>
<script>
document.getElementById("forgotForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("resetMessage");
    const btn = document.getElementById("forgotBtn");
    msg.style.display = "none";
    btn.disabled = true;
    btn.textContent = "Sending...";
    try {
        const data = await apiFetch("/auth/forgot-password", {
            method: "POST",
            body: JSON.stringify({
                email: document.getElementById("email").value.trim(),
                userType: document.getElementById("userType").value
            })
        });
        msg.style.color = "#2e7d32";
        msg.textContent = data.message;
    } catch (err) {
        msg.style.color = "#c0392b";
        msg.textContent = err.message;
    } finally {
        msg.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Send Reset Link";
    }
});
</script>
</body>
</html>
