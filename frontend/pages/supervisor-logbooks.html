 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARMS | Logbook Entries</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<header class="dashboard-navbar">
    <div class="dashboard-logo">ARMS</div>
    <div class="student-info">
        <span id="supervisorGreetingName">Supervisor</span>
        <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
</header>

<div class="dashboard-layout">

    <aside class="sidebar">
        <h3>Supervisor Portal</h3>
        <nav>
            <a href="supervisor-dashboard.html">Dashboard</a>
            <a href="supervisor-students.html">My Students</a>
            <a href="supervisor-logbooks.html" class="active">Logbook Entries</a>
            <a href="supervisor-evaluations.html">Evaluations</a>
            <a href="supervisor-notifications.html">Notifications</a>
            <a href="supervisor-reports.html">Reports</a>
        </nav>
    </aside>

    <main class="dashboard-content">

        <div class="dashboard-header">
            <h1>Logbook Entries</h1>
            <p>Review and approve entries from your assigned students.</p>
        </div>

        <section class="dashboard-section">
            <div class="table-container">
                <table>
                   <thead>
    <tr>
        <th>Student</th>
        <th>Week</th>
        <th>Activity</th>
        <th>Date</th>
        <th>Status</th>
        <th>Comment</th>
        <th></th>
    </tr>
</thead>
                    
                    <tbody id="logbookTableBody">
                        <tr><td colspan="6">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="dashboard-section" id="reviewFormSection" style="display:none;">
            <h2>Review Entry</h2>
            <p id="reviewEntryInfo"></p>
            <form id="reviewForm">
                <div class="form-group">
                    <label for="reviewComment">Comment</label>
                    <textarea id="reviewComment" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="reviewStatus">Decision</label>
                    <select id="reviewStatus">
                        <option value="Approved">Approve</option>
                        <option value="Rejected">Reject</option>
                    </select>
                </div>
                <button type="submit" class="auth-btn">Submit Review</button>
                <button type="button" class="reset-btn" id="cancelReview">Cancel</button>
            </form>
        </section>

    </main>

</div>

<script src="../js/main.js"></script>
</body>
</html>
