 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARMS | My Profile</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<!-- Top Navigation -->
<header class="dashboard-navbar">
    <div class="dashboard-logo">
        ARMS
    </div>
    <div class="student-info">
        <span>Student</span>
        <button class="logout-btn" id="logoutBtn">
            Logout
        </button>
    </div>
</header>

<div class="dashboard-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
        <h3>Student Portal</h3>
        <nav>
            <a href="student-dashboard.html">
                Dashboard
            </a>
            <a href="profile.html" class="active">
                My Profile
            </a>
            <a href="attachment.html">
                Attachment
            </a>
            <a href="logbook.html">
                Digital Logbook
            </a>
            <a href="evaluation.html">
                Evaluation
            </a>
            <a href="notifications.html">
                Notifications
            </a>
            <a href="reports.html">
                Reports
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="dashboard-content">

        <div class="dashboard-header">
            <h1>My Profile</h1>
            <p>
                View and update your personal information.
            </p>
        </div>

        <!-- Error / success message area -->
        <p id="profileMessage" class="form-error" style="display:none;"></p>

        <!-- Profile Form -->
        <section class="dashboard-section">

            <div class="profile-header">
                <div>
                    <h2 id="profileName">
                        Student Name
                    </h2>
                    <p id="profileRegistration">
                        Registration Number
                    </p>
                </div>
            </div>

            <form id="profileForm">

                <div class="profile-grid">

                    <!-- Registration Number -->
                    <div class="form-group">
                        <label for="registrationNumber">
                            Registration Number
                        </label>
                        <input
                            type="text"
                            id="registrationNumber"
                            name="registrationNumber"
                            placeholder="Registration number"
                            readonly
                        >
                    </div>

                    <!-- First Name -->
                    <div class="form-group">
                        <label for="firstName">
                            First Name
                        </label>
                        <input
                            type="text"
                            id="firstName"
                            name="firstName"
                            placeholder="First name"
                            required
                        >
                    </div>

                    <!-- Last Name -->
                    <div class="form-group">
                        <label for="lastName">
                            Last Name
                        </label>
                        <input
                            type="text"
                            id="lastName"
                            name="lastName"
                            placeholder="Last name"
                            required
                        >
                    </div>

                    <!-- Email -->
                    <div class="form-group">
                        <label for="email">
                            Email Address
                        </label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Email address"
                            readonly
                        >
                    </div>

                    <!-- Phone -->
                    <div class="form-group">
                        <label for="phoneNumber">
                            Phone Number
                        </label>
                        <input
                            type="tel"
                            id="phoneNumber"
                            name="phoneNumber"
                            placeholder="Phone number"
                            required
                        >
                    </div>

                    <!-- Course -->
                    <div class="form-group">
                        <label for="course">
                            Course
                        </label>
                        <input
                            type="text"
                            id="course"
                            name="course"
                            placeholder="Course"
                            required
                        >
                    </div>

                    <!-- Year -->
                    <div class="form-group">
                        <label for="yearOfStudy">
                            Year of Study
                        </label>
                        <select
                            id="yearOfStudy"
                            name="yearOfStudy"
                            required
                        >
                            <option value="">
                                Select year
                            </option>
                            <option value="1">
                                Year 1
                            </option>
                            <option value="2">
                                Year 2
                            </option>
                            <option value="3">
                                Year 3
                            </option>
                            <option value="4">
                                Year 4
                            </option>
                        </select>
                    </div>

                </div>

                <!-- Buttons -->
                <div class="profile-actions">
                    <button
                        type="submit"
                        class="auth-btn"
                    >
                        Save Changes
                    </button>
                </div>

            </form>

        </section>

    </main>

</div>

<script src="../js/main.js"></script>
</body>
</html>
