<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARMS | Reset Password</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="navbar">
    <div class="logo">ARMS</div>
    <nav>
        <a href="../index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </nav>
</header>

<main class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Reset Password</h1>
            <p>Choose a new password of at least 6 characters.</p>
        </div>

        <p id="resetMessage" class="form-error" style="display:none;"></p>

        <form id="resetForm">
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" placeholder="Enter new password" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm new password" required>
            </div>
            <button type="submit" class="auth-btn" id="resetBtn">Reset Password</button>
        </form>

        <p class="auth-footer"><a href="login.html">Back to login</a></p>
    </div>
</main>

<footer>
    <p>&copy; 2026 Attachment Record Management System</p>
</footer>

<script src="../js/main.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const token = params.get("token");
const accountType = params.get("type");

function showMessage(text, ok) {
    const msg = document.getElementById("resetMessage");
    msg.style.color = ok ? "#2e7d32" : "#c0392b";
    msg.textContent = text;
    msg.style.display = "block";
}

if (!token || !accountType) {
    showMessage("This reset link is incomplete. Request a new one.", false);
    document.getElementById("resetBtn").disabled = true;
}

document.getElementById("resetForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const password = document.getElementById("password").value;
    if (password !== document.getElementById("confirmPassword").value) {
        showMessage("The two passwords do not match.", false);
        return;
    }
    const btn = document.getElementById("resetBtn");
    btn.disabled = true;
    btn.textContent = "Saving...";
    try {
        const data = await apiFetch("/auth/reset-password", {
            method: "POST",
            body: JSON.stringify({ token, userType: accountType, password })
        });
        showMessage(data.message, true);
        setTimeout(() => { window.location.href = "login.html"; }, 2000);
    } catch (err) {
        showMessage(err.message, false);
        btn.disabled = false;
        btn.textContent = "Reset Password";
    }
});
</script>
</body>
</html>
